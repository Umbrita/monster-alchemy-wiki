<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Monster Alchemy Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.fullscreen/4.0.0/Control.FullScreen.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 900px;
    }

    .zone-link {
      color: #1a5fb4;
      text-decoration: none;
      font-weight: 600;
    }

    .zone-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.fullscreen/4.0.0/Control.FullScreen.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const bounds = [[0, 0], [4096, 4096]];

      const map = L.map("map", {
        crs: L.CRS.Simple,
        minZoom: -2,
        maxZoom: 3,
        zoomDelta: 0.5,
        zoomSnap: 0.5,
        scrollWheelZoom: true,
        doubleClickZoom: true,
        boxZoom: true,
        keyboard: true,
        dragging: true,
        fullscreenControl: true,
        fullscreenControlOptions: {
          position: "topleft"
        }
      });

      L.imageOverlay("map/esquemaMapa.png", bounds).addTo(map);
      map.setMaxBounds(bounds);
      map.fitBounds(bounds, { animate: false });

      setTimeout(() => {
        map.setView([1500, 2100], 0.5, { animate: false });
        map.invalidateSize(true);
      }, 50);

      const markers = [
        {
          id: "ID_2a598a0adabb",
          type: "Zone",
          loc: [750.9474016201134, 2023.4568340968208],
          link: "Southern Peninsula",
          tooltip: "hover"
        }
      ];

      const basePath =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
          ? ""
          : "/monster-alchemy-wiki";

      function toSlug(name) {
        return name.trim().toLowerCase().replace(/\s+/g, "-");
      }

      markers.forEach(m => {
        const [x, y] = m.loc;
        const slug = toSlug(m.link);
        const pageUrl = basePath + "/locations/" + slug;

        const marker = L.marker([y, x]).addTo(map);

        marker.bindPopup(`
          <strong>${m.link}</strong><br>
          Tipo: ${m.type}<br>
          <a class="zone-link" href="${pageUrl}" target="_top">Abrir página</a>
        `);

        if (m.tooltip === "hover") {
          marker.bindTooltip(m.link, {
            direction: "top"
          });
        }

        marker.on("click", function () {
          window.top.location.href = pageUrl;
        });
      });
    });
  </script>
</body>
</html>
