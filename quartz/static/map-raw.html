  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 900px;
    }

    #filter-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: white;
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-family: sans-serif;
      font-size: 14px;
      min-width: 160px;
    }

    #filter-panel strong {
      margin-bottom: 2px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
    }

    #filter-panel label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    #filter-panel .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .zone-link {
      color: #1a5fb4;
      text-decoration: none;
      font-weight: 600;
    }

    .zone-link:hover {
      text-decoration: underline;
    }

    /* Iconos de marker por tipo */
    .marker-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
  </style>

        loc: [1800, 2855],
        link: "Zurrap",
        tooltip: "hover"
      }
    ];

      // ── basePath local vs producción ────────────────────────────
      const basePath =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
          ? ""
          : "/monster-alchemy-wiki";

      function toSlug(name) {
        return name.trim().toLowerCase().replace(/\s+/g, "-");
      }

      function makeIcon(color) {
        return L.divIcon({
          className: "",
          html: `<div class="marker-icon" style="background:${color};"></div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12],
          popupAnchor: [0, -14]
        });
      }

      // ── Crear LayerGroups y checkboxes para las 5 categorías ────
      const layers = {};

      Object.entries(CATEGORIES).forEach(([type, cfg]) => {
        layers[type] = L.layerGroup().addTo(map);

        const label = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = true;
        cb.setAttribute("data-layer", type);
        cb.addEventListener("change", function () {
          if (this.checked) {
            layers[type].addTo(map);
          } else {
            layers[type].removeFrom(map);
          }
        });

        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = cfg.color;

        label.appendChild(cb);
        label.appendChild(dot);
        label.appendChild(document.createTextNode(" " + cfg.label));
        document.getElementById("filter-panel").appendChild(label);
      });

      // ── Añadir markers al mapa ───────────────────────────────────
      markers.forEach(m => {
        const [x, y] = m.loc;
        const slug = toSlug(m.link);
        const pageUrl = basePath + "/locations/" + slug;
        const cfg = CATEGORIES[m.type] || { color: "#888" };

        const marker = L.marker([x, y], { icon: makeIcon(cfg.color) });

        marker.bindPopup(`
          <strong>${m.link}</strong><br>
          Tipo: ${m.type}<br>
          <a class="zone-link" href="${pageUrl}" target="_top">Abrir página</a>
        `);

        if (m.tooltip === "hover") {
          marker.bindTooltip(m.link, { direction: "top" });
        }

        marker.on("click", function () {
          window.top.location.href = pageUrl;
        });

        if (layers[m.type]) {
          marker.addTo(layers[m.type]);
        }
      });
    });
  </script>
</body>
</html>
